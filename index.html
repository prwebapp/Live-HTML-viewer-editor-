<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Live Code Editor</title>

  <!-- PWA & Web App Manifest -->
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#252526">

  <!-- iOS Safari Specific Configuration -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="CodeEditor">
  <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' fill='%23007acc' rx='100'/%3E%3Cpath fill='%23ffffff' d='M160 150L60 256l100 106v-50l-53-56 53-56v-50zm192 0v50l53 56-53 56v50l100-106-100-106zm-110 230h40l80-260h-40l-80 260z'/%3E%3C/svg%3E">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      background-color: #1e1e1e;
      color: #fff;
      overflow: hidden;
    }

    header {
      padding: 10px 15px;
      background-color: #252526;
      border-bottom: 1px solid #333;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
    }

    header h1 {
      font-size: 1rem;
      font-weight: 500;
      color: #cccccc;
    }

    .header-controls {
      display: flex;
      gap: 8px;
    }

    .btn {
      background: #007acc;
      color: white;
      border: none;
      padding: 6px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 500;
      transition: background 0.2s;
    }

    .btn:hover {
      background: #005999;
    }

    .btn-secondary {
      background: #333333;
      color: #ccc;
    }

    .btn-secondary:hover {
      background: #444444;
      color: #fff;
    }

    .container {
      display: flex;
      flex: 1;
      height: calc(100vh - 45px);
      overflow: hidden;
      position: relative;
    }

    /* Side-by-Side Mode */
    .container.side-by-side {
      flex-direction: row;
    }
    .container.side-by-side .editor-section,
    .container.side-by-side .preview-section {
      width: 50%;
      height: 100%;
    }
    .container.side-by-side .editor-section {
      border-right: 2px solid #333;
      border-bottom: none;
    }

    /* Top-and-Bottom Mode */
    .container.top-and-bottom {
      flex-direction: column;
    }
    .container.top-and-bottom .editor-section,
    .container.top-and-bottom .preview-section {
      width: 100%;
      height: 50%;
    }
    .container.top-and-bottom .editor-section {
      border-bottom: 2px solid #333;
      border-right: none;
    }

    /* Collapsed State */
    .container.editor-collapsed .editor-section {
      display: none !important;
    }
    .container.editor-collapsed .preview-section {
      width: 100% !important;
      height: 100% !important;
    }

    .editor-section {
      display: flex;
      flex-direction: column;
      background-color: #1e1e1e;
    }

    .tabs {
      display: flex;
      background-color: #252526;
      border-bottom: 1px solid #333;
      flex-shrink: 0;
    }

    .tab-btn {
      padding: 8px 16px;
      background: none;
      border: none;
      color: #888;
      cursor: pointer;
      font-size: 0.85rem;
      border-right: 1px solid #333;
      outline: none;
    }

    .tab-btn.active {
      background-color: #1e1e1e;
      color: #007acc;
      border-top: 2px solid #007acc;
    }

    .code-area {
      flex: 1;
      position: relative;
    }

    textarea {
      width: 100%;
      height: 100%;
      background-color: #1e1e1e;
      color: #d4d4d4;
      border: none;
      padding: 12px;
      font-family: "Courier New", Courier, monospace;
      font-size: 14px;
      line-height: 1.5;
      resize: none;
      outline: none;
      display: none;
    }

    textarea.active {
      display: block;
    }

    .preview-section {
      background-color: #ffffff;
      flex: 1;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    /* Automatic Mobile Responsive Layout Override */
    @media (max-width: 768px) {
      .container {
        flex-direction: column !important;
      }
      .editor-section, 
      .preview-section {
        width: 100% !important;
        height: 50% !important;
      }
      .editor-section {
        border-right: none !important;
        border-bottom: 2px solid #333 !important;
      }
      #toggle-layout-btn {
        display: none;
      }
    }
  </style>
</head>
<body>

  <header>
    <h1>Live Code Editor</h1>
    <div class="header-controls">
      <button class="btn btn-secondary" id="toggle-editor-btn" onclick="toggleEditor()">Hide Code</button>
      <button class="btn" id="toggle-layout-btn" onclick="toggleLayout()">Layout: Side-by-Side</button>
    </div>
  </header>

  <div class="container side-by-side" id="main-container">
    <div class="editor-section" id="editor-box">
      <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('html')">HTML</button>
        <button class="tab-btn" onclick="switchTab('css')">CSS</button>
        <button class="tab-btn" onclick="switchTab('js')">JS</button>
      </div>
      
      <div class="code-area">
        <textarea id="html-code" class="active" placeholder="HTML code here..." oninput="updatePreview()"></textarea>
        <textarea id="css-code" placeholder="CSS code here..." oninput="updatePreview()"></textarea>
        <textarea id="js-code" placeholder="JS code here..." oninput="updatePreview()"></textarea>
      </div>
    </div>

    <div class="preview-section">
      <iframe id="preview"></iframe>
    </div>
  </div>

  <script>
    // Initial Code
    document.getElementById('html-code').value = `<h1>Hello Mobile PWA!</h1>\n<p>Type code above/left to view live updates.</p>\n<button id="btn">Click Me</button>`;
    document.getElementById('css-code').value = `body {\n  font-family: sans-serif;\n  padding: 15px;\n  color: #333;\n}\n\nh1 {\n  color: #007acc;\n  font-size: 1.5rem;\n}\n\nbutton {\n  padding: 10px 20px;\n  background: #007acc;\n  color: white;\n  border: none;\n  border-radius: 4px;\n  cursor: pointer;\n}`;
    document.getElementById('js-code').value = `document.getElementById('btn').addEventListener('click', () => {\n  alert('Button clicked successfully!');\n});`;

    function switchTab(tab) {
      const tabs = document.querySelectorAll('.tab-btn');
      const textareas = document.querySelectorAll('textarea');

      tabs.forEach(t => t.classList.remove('active'));
      textareas.forEach(ta => ta.classList.remove('active'));

      if (tab === 'html') {
        tabs[0].classList.add('active');
        document.getElementById('html-code').classList.add('active');
      } else if (tab === 'css') {
        tabs[1].classList.add('active');
        document.getElementById('css-code').classList.add('active');
      } else if (tab === 'js') {
        tabs[2].classList.add('active');
        document.getElementById('js-code').classList.add('active');
      }
    }

    let currentLayout = 'side-by-side';
    function toggleLayout() {
      const container = document.getElementById('main-container');
      const btn = document.getElementById('toggle-layout-btn');

      if (currentLayout === 'side-by-side') {
        container.classList.remove('side-by-side');
        container.classList.add('top-and-bottom');
        btn.textContent = 'Layout: Top / Bottom';
        currentLayout = 'top-and-bottom';
      } else {
        container.classList.remove('top-and-bottom');
        container.classList.add('side-by-side');
        btn.textContent = 'Layout: Side-by-Side';
        currentLayout = 'side-by-side';
      }
    }

    // Collapse / Expand Editor Functionality
    let isEditorCollapsed = false;
    function toggleEditor() {
      const container = document.getElementById('main-container');
      const btn = document.getElementById('toggle-editor-btn');

      isEditorCollapsed = !isEditorCollapsed;

      if (isEditorCollapsed) {
        container.classList.add('editor-collapsed');
        btn.textContent = 'Show Code';
      } else {
        container.classList.remove('editor-collapsed');
        btn.textContent = 'Hide Code';
      }
    }

    function updatePreview() {
      const html = document.getElementById('html-code').value;
      const css = document.getElementById('css-code').value;
      const js = document.getElementById('js-code').value;

      const iframe = document.getElementById('preview');
      const iframeDoc = iframe.contentDocument || iframe.contentWindow.document;

      const fullSource = `
        <!DOCTYPE html>
        <html>
        <head>
          <meta name="viewport" content="width=device-width, initial-scale=1.0">
          <style>${css}</style>
        </head>
        <body>
          ${html}
          <script>${js}<\/script>
        </body>
        </html>
      `;

      iframeDoc.open();
      iframeDoc.write(fullSource);
      iframeDoc.close();
    }

    updatePreview();

    // Register Service Worker
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(reg => console.log('Service Worker registered with scope:', reg.scope))
          .catch(err => console.error('Service Worker registration failed:', err));
      });
    }
  </script>
</body>
</html>
